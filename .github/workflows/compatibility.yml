name: ESLint compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  plugin-load:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18
            eslint: 7.32.0
          - node: 20
            eslint: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --legacy-peer-deps eslint@${{ matrix.eslint }}
      - run: node -e "const plugin = require('./'); if (!plugin.rules['fsd-relative-path'] || plugin.configs.recommended.plugins[0] !== 'fsd-import' || plugin.configs['flat/recommended'].plugins['fsd-import'] !== plugin) process.exit(1);"
